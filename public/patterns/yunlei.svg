<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1036 221" width="1036" height="221">
  <title>云雷纹（圆雷纹二方连续带）</title>
  <desc>圆雷纹二方连续横带。双行螺旋，以弧线勾连成带，共 9 个完整单元。
        自参考拓片忠实描摹：保留手作的不规则曲线，去除纸张纹理与色彩噪声；
        曲线未被规整化为数学标准形，因此本件按「整条带」使用，不作无缝阵列。
        底色透明，线条取原图青色 #015687；data-color-role="line" 供打版工具换色。</desc>

