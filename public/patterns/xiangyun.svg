<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <rect width="200" height="200" fill="#1a1a2e" rx="8"/>
  <!-- 祥云纹：飘逸云朵 -->
  <g fill="none" stroke="#e8d5a3" stroke-width="3" stroke-linecap="round">
    <!-- 主云头左 -->
    <path d="M 40 120 C 30 90, 50 70, 75 75 C 85 55, 120 50, 135 70 C 155 60, 175 75, 170 100"/>
    <!-- 云尾 -->
    <path d="M 170 100 C 185 95, 195 105, 190 115"/>
    <!-- 云头内部卷曲 -->
    <path d="M 70 90 C 75 80, 90 78, 95 85 C 100 92, 88 95, 82 90"/>
    <path d="M 120 85 C 115 75, 100 73, 95 80 C 90 87, 102 90, 108 85"/>
  </g>
  <!-- 祥云点缀（云气） -->
  <g fill="#e8d5a3" opacity="0.4">
    <circle cx="50" cy="50" r="3"/>
    <circle cx="65" cy="40" r="2"/>
    <circle cx="35" cy="60" r="2"/>
    <circle cx="150" cy="45" r="2.5"/>
    <circle cx="165" cy="55" r="2"/>
  </g>
  <!-- 下方云气 -->
  <g fill="none" stroke="#c9a84c" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <path d="M 30 150 Q 60 140 80 155 Q 100 165 120 150 Q 140 140 160 155"/>
  </g>
</svg>
