<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <rect width="200" height="200" fill="#1a1a2e" rx="8"/>
  <!-- 连珠纹：相连的圆珠 -->
  <!-- 主链 -->
  <g fill="#c9a84c" stroke="#8b6914" stroke-width="1.5">
    <circle cx="40" cy="100" r="12"/>
    <circle cx="70" cy="100" r="12"/>
    <circle cx="100" cy="100" r="12"/>
    <circle cx="130" cy="100" r="12"/>
    <circle cx="160" cy="100" r="12"/>
  </g>
  <!-- 上排小珠 -->
  <g fill="#e8d5a3" opacity="0.6">
    <circle cx="55" cy="70" r="6"/>
    <circle cx="85" cy="70" r="6"/>
    <circle cx="115" cy="70" r="6"/>
    <circle cx="145" cy="70" r="6"/>
  </g>
  <!-- 下排小珠 -->
  <g fill="#e8d5a3" opacity="0.6">
    <circle cx="55" cy="130" r="6"/>
    <circle cx="85" cy="130" r="6"/>
    <circle cx="115" cy="130" r="6"/>
    <circle cx="145" cy="130" r="6"/>
  </g>
  <!-- 珠子高光 -->
  <g fill="#fff" opacity="0.3">
    <circle cx="36" cy="96" r="4"/>
    <circle cx="66" cy="96" r="4"/>
    <circle cx="96" cy="96" r="4"/>
    <circle cx="126" cy="96" r="4"/>
    <circle cx="156" cy="96" r="4"/>
  </g>
</svg>
